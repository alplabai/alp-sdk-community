# alp-sdk-community library-skeleton template.
# `cp -r templates/library-skeleton libraries/<your-lib>` then fill in.
schema_version: 1
name: lib_template
kind: library
family: other                # change to the right family enum
interfaces: []               # libraries usually don't drive a bus directly
dependencies:
