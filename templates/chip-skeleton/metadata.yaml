# alp-sdk-community chip-skeleton template.
# `cp -r templates/chip-skeleton chips/<your-chip>` then fill in.
schema_version: 1
name: chip_template
kind: chip
family: sensor               # change to the right family enum from
                             # alp-sdk/metadata/schemas/contribution-v1.schema.json
interfaces:
  - i2c                      # bus your chip drives
dependencies:
  - { repo: alp-sdk, version: ">=0.5.0" }
license: Apache-2.0
author: "@yourgh"            # mandatory: becomes the CODEOWNER for this path
abi_version: "0.1"
description: "One-sentence customer-facing summary."
upstream_status: first-class community
verification:
  hil_silicon: untested      # bump to `verified` once you have HiL evidence
  smoke_tests: null_arg_guard
